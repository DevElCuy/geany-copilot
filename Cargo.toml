[package]
name = "try5"
version = "0.1.0"
edition = "2021"

[lib]
name = "copilot_plugin"
crate-type = ["cdylib"]

[profile.release]
lto = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
curl = "0.4"





# JSON-GLib FFI bindings
json-glib-sys = "0.1.1"
gio-sys = "0.8"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
pkg-config = "0.3"
